apiVersion: v1
kind: Namespace
metadata:
  name: payments
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments-api
  namespace: payments
spec:
  replicas: 1
  selector:
    matchLabels: { app: payments-api }
  template:
    metadata:
      labels: { app: payments-api }
    spec:
      containers:
        - name: payments-api
          image: payments-api:dev
          imagePullPolicy: IfNotPresent
          env:
            - name: PORT
              value: "3002"
            # Insights (rendered by scripts/run-demo.sh)
            # Get from Insights in Workspace
            - name: POSTMAN_INSIGHTS_PROJECT_ID
              value: "__PAYMENTS_PROJECT_ID__"
            - name: POSTMAN_INSIGHTS_API_KEY
              value: "__POSTMAN_API_KEY__"
            # Get from API Catalog
            - name: POSTMAN_INSIGHTS_WORKSPACE_ID
              value: "__PAYMENTS_WORKSPACE_ID__"
            - name: POSTMAN_INSIGHTS_SYSTEM_ENV
              value: "__POSTMAN_SYSTEM_ENV__"
          ports:
            - containerPort: 3002
          readinessProbe:
            httpGet: { path: /health, port: 3002 }
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: 3002 }
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: payments-api
  namespace: payments
spec:
  selector: { app: payments-api }
  ports:
    - name: http
      port: 3002
      targetPort: 3002
