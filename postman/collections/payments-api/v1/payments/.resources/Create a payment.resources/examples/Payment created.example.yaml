$kind: http-example
request:
  url: "{{baseUrl}}/v1/payments"
  method: POST
  headers:
    - key: Idempotency-Key
      value: string
      disabled: false
      description: ""
    - key: Content-Type
      value: application/json
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  body:
    type: json
    content: |-
      {
        "amount": 1394,
        "currency": "string",
        "method": {
          "type": "card",
          "cardToken": "string"
        },
        "description": "string"
      }
response:
  statusCode: 201
  statusText: Created
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "id": "string",
        "amount": 4666,
        "currency": "string",
        "status": "FAILED",
        "createdAt": "1995-07-25T15:36:59.891Z"
      }
order: 1000
