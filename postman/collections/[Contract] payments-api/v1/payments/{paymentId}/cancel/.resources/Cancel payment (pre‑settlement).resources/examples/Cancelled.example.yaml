$kind: http-example
request:
  url: "{{baseUrl}}/v1/payments/:paymentId/cancel"
  method: POST
  headers:
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  pathVariables:
    paymentId: pay_1001
  body:
    type: text
    content: ""
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "id": "pay_1001",
        "amount": 2500,
        "currency": "USD",
        "status": "FAILED",
        "createdAt": "2026-02-23T16:00:00Z"
      }
order: 1000
