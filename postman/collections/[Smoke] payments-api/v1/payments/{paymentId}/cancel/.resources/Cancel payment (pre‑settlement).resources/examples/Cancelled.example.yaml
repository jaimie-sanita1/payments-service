$kind: http-example
request:
  url: "{{baseUrl}}/v1/payments/:paymentId/cancel"
  method: POST
  headers:
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  pathVariables:
    paymentId: string
  body:
    type: text
    content: ""
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "id": "string",
        "amount": 4666,
        "currency": "string",
        "status": "FAILED",
        "createdAt": "1995-07-25T15:36:59.891Z"
      }
order: 1000
