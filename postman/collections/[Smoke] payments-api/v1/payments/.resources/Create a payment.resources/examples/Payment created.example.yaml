$kind: http-example
request:
  url: "{{baseUrl}}/v1/payments"
  method: POST
  headers:
    - key: Idempotency-Key
      value: 7c9e6679-7425-40de-944b-e07fc1f90ae7
      disabled: false
      description: ""
    - key: Content-Type
      value: application/json
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  body:
    type: json
    content: |-
      {
        "amount": 2500,
        "currency": "USD",
        "method": {
          "type": "card",
          "cardToken": "tok_visa_4242"
        },
        "description": "Order 4821"
      }
response:
  statusCode: 201
  statusText: Created
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "id": "pay_1001",
        "amount": 2500,
        "currency": "USD",
        "status": "FAILED",
        "createdAt": "2026-02-23T16:00:00Z"
      }
order: 1000
