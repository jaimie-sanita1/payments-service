name: CI/CD Pipeline

# Runs the Smoke and Contract collections created by the onboarding workflow
# against the workspace's private mock. IDs come from .postman/resources.yaml,
# so nothing here changes when the workspace is regenerated.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 */6 * * *"

concurrency:
  group: postman-ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      POSTMAN_API_KEY: ${{ secrets.POSTMAN_API_KEY }}
    steps:
      - uses: actions/checkout@v5

      - name: Install Postman CLI
        run: curl -fsSL https://dl-cli.pstmn.io/install/unix.sh | sh

      - name: Login to Postman CLI
        run: postman login --with-api-key "$POSTMAN_API_KEY"

      - name: Resolve Postman resources
        run: |
          if [ ! -f .postman/resources.yaml ]; then
            echo "No .postman/resources.yaml yet - run the Postman API onboarding workflow first"; exit 1
          fi
          ruby <<'RUBY'
          require 'yaml'
          config = YAML.load_file('.postman/resources.yaml') || {}
          cloud = config.fetch('canonical', config.fetch('cloudResources', {}))
          collections = cloud.fetch('collections', {})
          environments = cloud.fetch('environments', {})
          smoke = collections.find { |path, _| path.include?('[Smoke]') }&.last
          contract = collections.find { |path, _| path.include?('[Contract]') }&.last
          environment = environments.find { |path, _| path.end_with?('/prod.postman_environment.json') }&.last || environments.values.first
          workspace = config.dig('workspace', 'id')
          missing = []
          missing << 'smoke collection' unless smoke
          missing << 'contract collection' unless contract
          missing << 'workspace' unless workspace
          abort("Missing IDs in .postman/resources.yaml: #{missing.join(', ')}") unless missing.empty?
          File.open(ENV.fetch('GITHUB_ENV'), 'a') do |file|
            file.puts("POSTMAN_SMOKE_COLLECTION_UID=#{smoke}")
            file.puts("POSTMAN_CONTRACT_COLLECTION_UID=#{contract}")
            file.puts("POSTMAN_ENVIRONMENT_UID=#{environment}")
            file.puts("POSTMAN_WORKSPACE_ID=#{workspace}")
          end
          RUBY

      - name: Look up the workspace mock URL
        run: |
          url="$(curl -fsS -H "X-API-Key: $POSTMAN_API_KEY" \
            "https://api.getpostman.com/mocks?workspace=$POSTMAN_WORKSPACE_ID" \
            | jq -r '.mocks | first | .mockUrl // empty')"
          if [ -z "$url" ]; then echo "No mock found in workspace $POSTMAN_WORKSPACE_ID"; exit 1; fi
          echo "BASE_URL=$url" >> "$GITHUB_ENV"

      - name: Run Smoke Tests
        run: |
          postman collection run "$POSTMAN_SMOKE_COLLECTION_UID" \
            ${POSTMAN_ENVIRONMENT_UID:+-e "$POSTMAN_ENVIRONMENT_UID"} \
            --env-var "baseUrl=$BASE_URL" \
            --env-var "postmanPrivateMockApiKey=$POSTMAN_API_KEY" \
            --report-events

      - name: Run Contract Tests
        run: |
          postman collection run "$POSTMAN_CONTRACT_COLLECTION_UID" \
            ${POSTMAN_ENVIRONMENT_UID:+-e "$POSTMAN_ENVIRONMENT_UID"} \
            --env-var "baseUrl=$BASE_URL" \
            --env-var "postmanPrivateMockApiKey=$POSTMAN_API_KEY" \
            --report-events
