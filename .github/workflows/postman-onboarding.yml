name: Postman API onboarding

on:
  workflow_dispatch:

jobs:
  onboarding:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
    steps:
      - uses: actions/checkout@v5

      - id: postman-token
        uses: postman-cs/postman-resolve-service-token-action@v2
        with:
          postman-api-key: ${{ secrets.POSTMAN_API_KEY }}
          postman-region: us

      - id: onboard
        uses: postman-cs/postman-api-onboarding-action@v3
        with:
          project-name: payments-api
          workspace-id: a1ae5022-d368-4e0d-a65b-463f2099a9f5
          workspace-team-id: '132109'
          spec-path: openapi.yaml
          environments-json: '["dev","prod"]'
          mock-visibility: private
          generate-ci-workflow: 'true'
          # Reuse what the first run created instead of creating duplicates
          mock-url: https://2f560973-4d57-411f-8c5f-a12e4939fadf.mock.pstmn.io
          environment-uids-json: '{"dev":"56136551-c054bdd8-6cde-44bb-842e-d2ce5342227f","prod":"56136551-070b9613-4164-4d80-b4b4-b98db7d9556d"}'
          # dev -> local kind cluster behind ingress-nginx, prod -> private mock (what CI runs against)
          env-runtime-urls-json: '{"dev":"http://localhost/payments","prod":"https://2f560973-4d57-411f-8c5f-a12e4939fadf.mock.pstmn.io"}'
          # Insights turns on automatically once the human-user secrets exist
          enable-insights: ${{ secrets.INSIGHTS_POSTMAN_API_KEY != '' && secrets.INSIGHTS_POSTMAN_ACCESS_TOKEN != '' && 'true' || 'false' }}
          insights-postman-api-key: ${{ secrets.INSIGHTS_POSTMAN_API_KEY }}
          insights-postman-access-token: ${{ secrets.INSIGHTS_POSTMAN_ACCESS_TOKEN }}
          cluster-name: demo
          postman-region: us
          postman-api-key: ${{ secrets.POSTMAN_API_KEY }}
          postman-access-token: ${{ steps.postman-token.outputs.token }}
          postman-team-id: ${{ steps.postman-token.outputs.team-id }}
          github-token: ${{ secrets.GH_PAT }}

      - run: |
          echo "Workspace: ${{ steps.onboard.outputs.workspace-url }}"
          echo "Mock: ${{ steps.onboard.outputs.mock-url }}"
